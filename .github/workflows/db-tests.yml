name: DB tests

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db-tests.yml"

jobs:
  db-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same major version as supabase/config.toml (db.major_version = 17); the
      # runner image ships 16, so install 17 from the PostgreSQL apt repository.
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
      - name: Run database tests
        run: PG_BIN=/usr/lib/postgresql/17/bin supabase/tests/run.sh
