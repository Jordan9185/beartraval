name: BearTravel
options:
  # 使用者介面以繁體中文為主（系統元件也跟著顯示繁中）。
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AppCore:
    path: Packages/AppCore
targets:
  BearTravel:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AppCore
        product: AppCore
      - package: AppCore
        product: Features
      - package: AppCore
        product: ShareCore
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 品牌主色：熊毛棕（D13，2026-09-25）。按鈕、連結、分頁列一起換色。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
    preBuildScripts:
      # Release（TestFlight）缺 Config/Cloud.xcconfig.local 時會沿用 Base 的本機位址，
      # 包出一個連不到後端的 App；直接讓 build 失敗。
      - name: Check Release backend
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            case "${SUPABASE_URL}" in
              ""|*://127.0.0.1*|*://localhost*|*://0.0.0.0*)
                echo "error: Release build 的 SUPABASE_URL 是本機位址（${SUPABASE_URL:-空白}）。請建立 Config/Cloud.xcconfig.local（格式見 Config/Release.xcconfig）。"
                exit 1 ;;
            esac
            if [ -z "${SUPABASE_ANON_KEY}" ]; then
              echo "error: Release build 缺少 SUPABASE_ANON_KEY（Config/Cloud.xcconfig.local）。"
              exit 1
            fi
          fi
    entitlements:
      path: App/BearTravel.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BeaRTravel
        # 版本號只在 settings.base 的 MARKETING_VERSION／CURRENT_PROJECT_VERSION 改。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # 邀請連結 beartravel://invite?token=…（Universal Link 待有網域後補上）
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [beartravel]
        # 本機 Supabase 走 http；只放行 localhost。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppGroupIdentifier: $(APP_GROUP_ID)
        # 外開韓國在地地圖（§4.3.1）
        LSApplicationQueriesSchemes: [nmap, kakaomap, comgooglemaps]
        # 只在使用 App 時：地圖上顯示你的位置（不做背景定位，規格 §2 範圍外）。
        NSLocationWhenInUseUsageDescription: 在地圖上顯示你目前的位置，方便對照今天的行程。
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension/Sources
      - ShareExtension/Resources
    dependencies:
      - package: AppCore
        product: AppCore
      - package: AppCore
        product: ShareCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: $(EXTENSION_ENTITLEMENTS)
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BeaRTravel
        # 須與主 App 相同版本。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # 網址、文字、輪播圖片或可取得的影片檔都先保存；辨識在主 App／後端完成。
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1
  BearTravelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: BearTravel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  BearTravel:
    build:
      targets:
        BearTravel: all
    test:
      targets:
        - package: AppCore/AppCoreTests
        - BearTravelUITests
