name: BearTravel
options:
  # 使用者介面以繁體中文為主（系統元件也跟著顯示繁中）。
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AppCore:
    path: Packages/AppCore
targets:
  BearTravel:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AppCore
        product: AppCore
      - package: AppCore
        product: Features
      - package: AppCore
        product: ShareCore
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
    entitlements:
      path: App/BearTravel.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BeaRTravel
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # 邀請連結 beartravel://invite?token=…（Universal Link 待有網域後補上）
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [beartravel]
        # 本機 Supabase 走 http；只放行 localhost。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppGroupIdentifier: $(APP_GROUP_ID)
        # 外開韓國在地地圖（§4.3.1）
        LSApplicationQueriesSchemes: [nmap, kakaomap, comgooglemaps]
        # 只在使用 App 時：地圖上顯示你的位置（不做背景定位，規格 §2 範圍外）。
        NSLocationWhenInUseUsageDescription: 在地圖上顯示你目前的位置，方便對照今天的行程。
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension/Sources
      - ShareExtension/Resources
    dependencies:
      - package: AppCore
        product: AppCore
      - package: AppCore
        product: ShareCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: $(EXTENSION_ENTITLEMENTS)
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BeaRTravel
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # S2 Payload Inspector：接受所有型別以記錄 payload。正式版（WP6）要收斂成明確規則。
            NSExtensionActivationRule: TRUEPREDICATE
  BearTravelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: BearTravel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  BearTravel:
    build:
      targets:
        BearTravel: all
    test:
      targets:
        - package: AppCore/AppCoreTests
        - BearTravelUITests
