name: BearTravel
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AppCore:
    path: Packages/AppCore
targets:
  BearTravel:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AppCore
        product: AppCore
      - package: AppCore
        product: Features
      - package: AppCore
        product: ShareCore
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/BearTravel.entitlements
    entitlements:
      path: App/BearTravel.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BearTravel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        AppGroupIdentifier: $(APP_GROUP_ID)
        # 外開韓國在地地圖（§4.3.1）
        LSApplicationQueriesSchemes: [nmap, kakaomap]
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension/Sources
    dependencies:
      - package: AppCore
        product: ShareCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).beartravel.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BearTravel
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # S2 Payload Inspector：接受所有型別以記錄 payload。正式版（WP6）要收斂成明確規則。
            NSExtensionActivationRule: TRUEPREDICATE
schemes:
  BearTravel:
    build:
      targets:
        BearTravel: all
    test:
      targets:
        - package: AppCore/AppCoreTests
